[project]
name = "claude-workflow-kit"
version = "0.1.0"
description = "Autonomous task queue, hooks, agent fleet, and memory/context MCP servers for Claude Code"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = ["PyYAML>=6.0"]

[project.optional-dependencies]
mcp = ["mcp>=1.0"]
dev = ["pytest>=7.0"]

[tool.setuptools]
packages = ["taskloop"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.pyright]
extraPaths = ["."]
