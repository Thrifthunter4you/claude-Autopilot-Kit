[project]
name = "claude-workflow-kit"
version = "0.3.0"
description = "Autonomous engineering loop for Claude Code: file-backed task queue, chunked fresh-context workers, self-feeding hooks, tiered agent fleet, script toolbox, token and noise-floor measurement, memory/context MCP servers"
keywords = ["claude-code", "claude", "autonomous-agents", "ai-agents", "task-queue", "hooks", "mcp", "context-engineering", "token-optimization", "developer-tools", "automation"]
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = ["PyYAML>=6.0"]

[project.optional-dependencies]
mcp = ["mcp>=1.0"]
dev = ["pytest>=7.0"]

[tool.setuptools]
packages = ["taskloop"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.pyright]
extraPaths = ["."]
