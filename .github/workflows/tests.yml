name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: python -m pip install pyyaml pytest
      - name: Run test suite
        run: python -m pytest tests/ -q
      - name: CLI --help smoke (no side effects)
        run: |
          TMP="$(mktemp -d)"
          for b in task-add task-list task-go drain-once run-manifest toolbox token-audit spill noise-floor hook-cost; do
            TASKLOOP_HOME="$TMP" ./bin/$b --help > /dev/null
          done
          [ -z "$(ls -A "$TMP")" ] || { echo "--help created state"; exit 1; }
